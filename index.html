<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">
<title>For Marion ❤️</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background: radial-gradient(circle, #351044, #100016);
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    text-align: center;
}

.container {
    padding: 25px;
    max-width: 500px;
    z-index: 2;
}

h1 {
    color: #ff85c1;
    font-size: 2.5rem;
    text-shadow: 0 0 20px #ff1493;
    margin-bottom: 15px;
}

.heart {
    font-size: 100px;
    animation: heartbeat 1.2s infinite;
    filter: drop-shadow(0 0 25px #ff278c);
    margin: 20px;
}

@keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.2); }
}

p {
    font-size: 1.1rem;
    line-height: 1.7;
    margin: 20px 0;
}

button {
    padding: 14px 25px;
    border: none;
    border-radius: 30px;
    background: linear-gradient(45deg, #ff1493, #a855f7);
    color: white;
    font-size: 1rem;
    cursor: pointer;
    box-shadow: 0 0 20px #ff1493;
    transition: transform 0.3s;
}

button:hover {
    transform: scale(1.08);
}

#secret {
    display: none;
    color: #ffb6d9;
    margin-top: 25px;
    animation: appear 1.5s ease;
}

@keyframes appear {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}

.floating-heart {
    position: absolute;
    bottom: -30px;
    color: #ff80bd;
    animation: floatUp 6s linear forwards;
    pointer-events: none;
}

@keyframes floatUp {
    to {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
    }
}
</style>
</head>

<body>
<div class="container">
    <h1>For My Marion 💕</h1>

      <audio id="lovesong" preload="auto">
        <source src=" ./Heaven%20Baby%20Remix.mp3"
        type="audio/mpeg">
    </audio>

    <div class="heart">❤️</div>

    <p>
        Every beautiful story has a special person.
        In mine, that person is you. 🥹
    </p>

    <button onclick="revealLove()">
        Open my heart 💌
    </button>

    <div id="secret">
        <h2>My Sweet Marion 🌹</h2>
        <p id="message"></p>
        <p>Forever grateful to have you in my life. ❤️</p>
    </div>
</div>

<script>
const loveMessage =
    "Marion, if I could give you one thing in this world, " +
    "it would be the ability to see yourself through my eyes. " +
    "Then you would understand how special you are to me. " +
    "No matter how busy life gets, I will always appreciate " +
    "the beautiful memories we make together. I love you! ❤️";

function revealLove() {
    const song = document.getElementById("lovesong");
      song.play();

      const secret = document.getElementById("secret");
      secret.style.display = "block";
      
    const message = document.getElementById("message");

    if (secret.style.display === "block") return;

    secret.style.display = "block";
    message.textContent = "";
    let i = 0;

    const typing = setInterval(() => {
        message.textContent += loveMessage[i];
        i++;

        if (i >= loveMessage.length) {
            clearInterval(typing);
        }
    }, 65);
}

function createHeart() {
    const heart = document.createElement("div");
    heart.className = "floating-heart";
    heart.textContent = "♥️";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = (15 + Math.random() * 25) + "px";
    heart.style.animationDuration = (4 + Math.random() * 4) + "s";

    document.body.appendChild(heart);

    setTimeout(() => heart.remove(), 8000);
}

setInterval(createHeart, 400);
</script>
</body>
</html>
